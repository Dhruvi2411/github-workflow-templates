name: Reusable Artifact Publish

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string

jobs:
  publish:
    runs-on: self-hosted

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}

      - name: Verify Artifact
        run: |
          ls -lh