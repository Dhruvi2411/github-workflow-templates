
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping
      environment: blue
  template:
    metadata:
      labels:
        app: shopping
        environment: blue
        version: v1
    spec:
      containers:
        - name: mordenchair
          image: dhruvi1611/website:3
          ports:
            - containerPort: 80
